
name: Schedule Probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test schedule
        run: |
          echo "Schedule is working"
          echo "UTC time:"
          date -u
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Event: $GITHUB_EVENT_NAME"
